<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Roedor">
  <circle cx="60" cy="60" r="54" fill="#FCE9EB" stroke="#C1121F" stroke-width="2.5"/>
  <!-- tail -->
  <path d="M84 74 C104 74 104 50 92 46" fill="none" stroke="#26323A" stroke-width="3.5" stroke-linecap="round"/>
  <!-- body -->
  <ellipse cx="60" cy="66" rx="26" ry="17" fill="#26323A"/>
  <!-- head -->
  <path d="M38 62 C28 60 26 74 34 78 C40 81 48 78 50 70 Z" fill="#26323A"/>
  <!-- ear -->
  <circle cx="50" cy="54" r="8" fill="#26323A"/>
  <circle cx="50" cy="54" r="3.5" fill="#FCE9EB"/>
  <!-- nose -->
  <circle cx="28" cy="70" r="2.6" fill="#C1121F"/>
  <!-- eye -->
  <circle cx="40" cy="64" r="2.4" fill="#FCE9EB"/>
  <!-- feet -->
  <g stroke="#26323A" stroke-width="3" stroke-linecap="round">
    <path d="M52 82 L50 92"/>
    <path d="M66 82 L66 93"/>
  </g>
  <!-- whiskers -->
  <g stroke="#26323A" stroke-width="1.6" stroke-linecap="round" opacity="0.7">
