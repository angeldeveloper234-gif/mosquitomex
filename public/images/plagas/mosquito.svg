<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Mosquito">
  <circle cx="60" cy="60" r="54" fill="#FCE9EB" stroke="#C1121F" stroke-width="2.5"/>
  <g fill="none" stroke="#26323A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- legs -->
    <path d="M55 62 L40 78 L34 88"/>
    <path d="M60 63 L52 82 L48 94"/>
    <path d="M64 63 L66 84 L62 96"/>
    <path d="M56 58 L40 52 L30 46"/>
    <path d="M62 58 L58 42 L52 32"/>
    <path d="M66 59 L74 46 L82 38"/>
    <!-- proboscis -->
    <path d="M47 52 L30 40"/>
    <!-- antennae -->
    <path d="M50 47 L44 34"/>
    <path d="M54 46 L54 32"/>
  </g>
  <!-- wings -->
  <g fill="#26323A" opacity="0.16">
    <ellipse cx="72" cy="50" rx="22" ry="9" transform="rotate(24 72 50)"/>
    <ellipse cx="74" cy="58" rx="22" ry="9" transform="rotate(38 74 58)"/>
  </g>
  <!-- body -->
  <ellipse cx="64" cy="62" rx="20" ry="8.5" transform="rotate(28 64 62)" fill="#26323A"/>
  <!-- head -->
  <circle cx="49" cy="51" r="7" fill="#26323A"/>
  <!-- eye -->
  <circle cx="47" cy="49" r="2" fill="#FCE9EB"/>
</svg>
